version: "3.9"

services:
  backend:
    build: ./backend
    container_name: medical_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./vectorstore:/app/vectorstore
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: medical_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000/ask
    restart: unless-stopped
